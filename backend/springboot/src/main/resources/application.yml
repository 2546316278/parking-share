server:
  port: 8080

spring:
  application:
    name: shared-parking

  # ==================== 数据源 ====================
  # 建库语句见 databases/schema.sql，本机 MySQL 是 5.7.24。
  #
  # 三个参数不能省，少一个就出问题：
  #   characterEncoding=UTF-8      MySQL 服务端默认 latin1，不加中文变问号
  #   serverTimezone=Asia/Shanghai DATETIME 的 CURRENT_TIMESTAMP 按会话时区算，
  #                                不指定会跟 Python 视觉进程差 8 小时，直接影响计费
  #   useSSL=false                 本地连接不需要加密，开着会多几秒握手
  datasource:
    url: jdbc:mysql://localhost:3306/shared_parking?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: SharedParkingPool

  # 接口返回的 JSON 里，时间统一按东八区序列化，不要输出成 UTC。
  # 注意：date-format 只对 java.util.Date 生效，本项目用的 LocalDateTime
  # 靠 config/JacksonConfig.java 处理，别以为在这里改了就生效。
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# ==================== MyBatis-Plus ====================
mybatis-plus:
  configuration:
    # 数据库下划线字段 ↔ Java 驼峰属性，physical_status ↔ physicalStatus
    map-underscore-to-camel-case: true
    # 开发期把执行的 SQL 打到控制台，方便确认有没有写错字段。
    # 上线前改成 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键由数据库 AUTO_INCREMENT 生成
      id-type: auto
      # 逻辑删除暂不启用，冲突记录需要物理保留

logging:
  level:
    root: info
    com.sharedparking: debug
